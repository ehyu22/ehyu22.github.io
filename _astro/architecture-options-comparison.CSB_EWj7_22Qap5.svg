<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .outer   { fill: none; stroke: rgba(26,34,48,0.28); stroke-dasharray: 6 4; }
    .card    { fill: #ffffff; stroke: rgba(26,34,48,0.18); }
    .fg      { fill: #1A2230; }
    .muted   { fill: #6B7587; }
    .accent-card { fill: #E0F2FE; stroke: #0369A1; }
    .accent-text { fill: #0369A1; }
    .line    { stroke: #94A0B4; fill: none; }
    .aline   { stroke: #0369A1; fill: none; }
    .dot     { fill: #94A0B4; }
    text     { font-size: 12px; }
  </style>
  <text x="480" y="30" text-anchor="middle" class="fg" font-size="18" font-weight="700">게이트웨이 아키텍처 후보 비교</text>
  <rect class="outer" x="20" y="60" width="290" height="390" rx="12"/>
  <text x="165" y="86" text-anchor="middle" class="fg" font-weight="700" font-size="14">1. 베어메탈 GW 노드</text>
  <rect class="card" x="85" y="104" width="160" height="34" rx="8"/>
  <text x="165" y="126" text-anchor="middle" class="fg">사용자 (서비스망)</text>
