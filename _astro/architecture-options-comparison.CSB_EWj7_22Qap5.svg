  <text x="165" y="224" text-anchor="middle" class="muted" font-size="11">NIC 2장으로 두 망에 연결</text>
  <text x="165" y="242" text-anchor="middle" class="muted" font-size="11">리버스 프록시 / S3 프록시</text>
  <text x="165" y="260" text-anchor="middle" class="muted" font-size="11">이중화 시 서버 1대 추가</text>
