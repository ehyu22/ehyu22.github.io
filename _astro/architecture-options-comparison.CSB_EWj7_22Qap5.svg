  <text x="480" y="364" text-anchor="middle" class="fg" font-size="11">S3</text>
  <text x="565" y="364" text-anchor="middle" class="fg" font-size="11">S3</text>
  <text x="480" y="400" text-anchor="middle" class="muted" font-size="11">스토리지 노드 (스토리지망)</text>
  <text x="480" y="432" text-anchor="middle" class="fg" font-size="11.5">패스스루 설정 부담</text>
  <rect class="outer" x="650" y="60" width="290" height="390" rx="12"/>
  <text x="795" y="86" text-anchor="middle" class="fg" font-weight="700" font-size="14">3. K8s + Istio Envoy Pod (채택)</text>
  <rect class="card" x="715" y="104" width="160" height="34" rx="8"/>
  <text x="795" y="126" text-anchor="middle" class="fg">사용자 (서비스망)</text>
  <path class="aline" d="M795,138 L795,176"/>
  <rect class="accent-card" x="675" y="176" width="240" height="96" rx="10" stroke-width="1.5"/>
