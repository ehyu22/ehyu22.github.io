  <path class="line" d="M80,318 L250,318"/>
  <path class="line" d="M80,318 L80,340"/>
  <path class="line" d="M165,318 L165,340"/>
  <path class="line" d="M250,318 L250,340"/>
  <rect class="card" x="45" y="340" width="70" height="40" rx="6"/>
  <rect class="card" x="130" y="340" width="70" height="40" rx="6"/>
  <rect class="card" x="215" y="340" width="70" height="40" rx="6"/>
  <text x="80" y="364" text-anchor="middle" class="fg" font-size="11">S3</text>
  <text x="165" y="364" text-anchor="middle" class="fg" font-size="11">S3</text>
  <text x="250" y="364" text-anchor="middle" class="fg" font-size="11">S3</text>
  <text x="165" y="400" text-anchor="middle" class="muted" font-size="11">스토리지 노드 (스토리지망)</text>
  <text x="165" y="432" text-anchor="middle" class="fg" font-size="11.5">전용 물리 서버 필요</text>
