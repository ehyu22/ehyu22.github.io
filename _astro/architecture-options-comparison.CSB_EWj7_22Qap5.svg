  <path class="line" d="M710,318 L880,318"/>
  <path class="line" d="M710,318 L710,340"/>
  <path class="line" d="M795,318 L795,340"/>
  <path class="line" d="M880,318 L880,340"/>
  <rect class="card" x="675" y="340" width="70" height="40" rx="6"/>
  <rect class="card" x="760" y="340" width="70" height="40" rx="6"/>
  <rect class="card" x="845" y="340" width="70" height="40" rx="6"/>
  <text x="710" y="364" text-anchor="middle" class="fg" font-size="11">S3</text>
  <text x="795" y="364" text-anchor="middle" class="fg" font-size="11">S3</text>
  <text x="880" y="364" text-anchor="middle" class="fg" font-size="11">S3</text>
  <text x="795" y="400" text-anchor="middle" class="muted" font-size="11">스토리지 노드 (스토리지망)</text>
  <text x="795" y="432" text-anchor="middle" class="fg" font-size="11.5">별도 인프라 불필요</text>
