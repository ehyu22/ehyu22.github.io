<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .outer   { fill: none; stroke: rgba(26,34,48,0.28); stroke-dasharray: 6 4; }
    .card    { fill: #ffffff; stroke: rgba(26,34,48,0.18); }
    .fg      { fill: #1A2230; }
    .muted   { fill: #6B7587; }
    .accent-card { fill: #E0F2FE; stroke: #0369A1; }
    .accent-text { fill: #0369A1; }
    .line    { stroke: #94A0B4; fill: none; }
    .aline   { stroke: #0369A1; fill: none; }
    .dot     { fill: #94A0B4; }
    text     { font-size: 12px; }
  </style>

  <text x="480" y="28" text-anchor="middle" class="fg" font-size="18" font-weight="700">기존 구조 — 서비스망과 스토리지망 분리</text>

  <!-- user -->
  <rect class="card" x="400" y="48" width="160" height="40" rx="8"/>
  <text x="480" y="73" text-anchor="middle" class="fg" font-weight="700">사용자</text>
  <path class="line" d="M480,88 L480,118"/>

  <!-- service network -->
  <rect class="outer" x="20" y="118" width="920" height="150" rx="12"/>
  <text x="40" y="140" class="muted">서비스망 (Ethernet) — 사용자 트래픽</text>
  <rect class="card" x="60" y="156" width="250" height="90" rx="10"/>
  <text x="80" y="182" class="fg" font-weight="700" font-size="13">K8s 노드</text>
  <text x="80" y="202" class="muted" font-size="11">GPU 워크로드</text>
  <text x="80" y="220" class="muted" font-size="11">서비스망 + 스토리지망 연결</text>
  <rect class="card" x="355" y="156" width="250" height="90" rx="10"/>
  <text x="375" y="182" class="fg" font-weight="700" font-size="13">K8s 노드</text>
  <text x="375" y="202" class="muted" font-size="11">GPU 워크로드</text>
  <text x="375" y="220" class="muted" font-size="11">서비스망 + 스토리지망 연결</text>
  <rect class="card" x="650" y="156" width="250" height="90" rx="10"/>
  <text x="670" y="182" class="fg" font-weight="700" font-size="13">K8s 노드</text>
  <text x="670" y="202" class="muted" font-size="11">GPU 워크로드</text>
  <text x="670" y="220" class="muted" font-size="11">서비스망 + 스토리지망 연결</text>

  <!-- node -> storage links -->
  <path class="line" stroke-dasharray="4 3" d="M185,246 L185,344"/>
  <path class="line" stroke-dasharray="4 3" d="M480,246 L480,344"/>
  <path class="line" stroke-dasharray="4 3" d="M775,246 L775,344"/>
  <text x="492" y="292" class="muted" font-size="10.5">볼륨 마운트 (CSI)</text>

  <!-- storage network -->
  <rect class="outer" x="20" y="306" width="920" height="144" rx="12"/>
  <text x="40" y="443" class="muted">스토리지망 (InfiniBand) — 사용자가 직접 도달할 수 없음</text>
  <rect class="card" x="60" y="344" width="250" height="84" rx="10"/>
  <text x="80" y="370" class="fg" font-weight="700" font-size="13">스토리지 노드</text>
  <rect class="accent-card" x="80" y="386" width="210" height="24" rx="5"/>
  <text x="185" y="402" text-anchor="middle" class="accent-text" font-size="11" font-weight="600">S3 엔드포인트</text>
  <rect class="card" x="355" y="344" width="250" height="84" rx="10"/>
  <text x="375" y="370" class="fg" font-weight="700" font-size="13">스토리지 노드</text>
  <rect class="accent-card" x="375" y="386" width="210" height="24" rx="5"/>
  <text x="480" y="402" text-anchor="middle" class="accent-text" font-size="11" font-weight="600">S3 엔드포인트</text>
  <rect class="card" x="650" y="344" width="250" height="84" rx="10"/>
  <text x="670" y="370" class="fg" font-weight="700" font-size="13">스토리지 노드</text>
  <rect class="accent-card" x="670" y="386" width="210" height="24" rx="5"/>
  <text x="775" y="402" text-anchor="middle" class="accent-text" font-size="11" font-weight="600">S3 엔드포인트</text>
</svg>
