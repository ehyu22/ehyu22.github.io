<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .outer   { fill: none; stroke: rgba(26,34,48,0.28); stroke-dasharray: 6 4; }
    .card    { fill: #ffffff; stroke: rgba(26,34,48,0.18); }
    .fg      { fill: #1A2230; }
    .muted   { fill: #6B7587; }
    .accent-card { fill: #E0F2FE; stroke: #0369A1; }
    .accent-text { fill: #0369A1; }
    .line    { stroke: #94A0B4; fill: none; }
    .dot     { fill: #94A0B4; }
    text     { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .outer   { stroke: rgba(226,232,240,0.28); }
      .card    { fill: #1C2433; stroke: rgba(226,232,240,0.16); }
      .fg      { fill: #E2E8F0; }
      .muted   { fill: #8899AA; }
      .accent-card { fill: #0C1A2E; stroke: #38BDF8; }
      .accent-text { fill: #38BDF8; }
      .line    { stroke: #5B6472; }
      .dot     { fill: #5B6472; }
    }
  </style>

  <text x="480" y="28" text-anchor="middle" class="fg" font-size="18" font-weight="700">Lab-p1 토폴로지 — Control-plane 3 + Worker 2</text>
  <text x="40" y="54" class="muted" font-size="12">192.168.56.0/24 — private network (eth1, 정적 IP)</text>

  <rect class="outer" x="20" y="64" width="920" height="440" rx="12"/>

  <!-- VIP -->
  <rect class="accent-card" x="380" y="94" width="200" height="56" rx="8" stroke-width="1.5"/>
  <text x="480" y="115" text-anchor="middle" class="accent-text" font-weight="700">VIP 192.168.56.10</text>
  <text x="480" y="132" text-anchor="middle" class="muted" font-size="10.5">keepalived · active/standby</text>

  <!-- VRRP connectors: VIP -> cp-1/2/3 -->
  <path class="line" stroke-dasharray="4 3" d="M400,150 L180,190"/>
  <path class="line" stroke-dasharray="4 3" d="M480,150 L480,190"/>
  <path class="line" stroke-dasharray="4 3" d="M560,150 L780,190"/>
  <circle class="dot" cx="180" cy="190" r="2.5"/>
  <circle class="dot" cx="480" cy="190" r="2.5"/>
  <circle class="dot" cx="780" cy="190" r="2.5"/>
  <text x="480" y="176" text-anchor="middle" class="muted" font-size="10">VRRP</text>

  <!-- control-plane row -->
  <g>
    <rect class="card" x="50" y="190" width="260" height="150" rx="10"/>
    <text x="70" y="215" class="fg" font-weight="700" font-size="13">cp-1</text>
    <text x="70" y="230" class="muted" font-size="11">192.168.56.11 · 2 vCPU / 4GB</text>
    <line x1="70" y1="240" x2="290" y2="240" class="line"/>
    <text x="70" y="258" class="fg" font-size="11">etcd</text>
    <text x="70" y="274" class="fg" font-size="11">kube-apiserver</text>
    <text x="70" y="290" class="fg" font-size="11">kube-scheduler</text>
    <text x="70" y="306" class="fg" font-size="11">kube-controller-manager</text>
    <rect class="accent-card" x="70" y="314" width="220" height="20" rx="5" stroke-width="1"/>
    <text x="180" y="328" text-anchor="middle" class="accent-text" font-size="10.5" font-weight="600">HAProxy + keepalived</text>
  </g>

  <g>
    <rect class="card" x="350" y="190" width="260" height="150" rx="10"/>
    <text x="370" y="215" class="fg" font-weight="700" font-size="13">cp-2</text>
    <text x="370" y="230" class="muted" font-size="11">192.168.56.12 · 2 vCPU / 4GB</text>
    <line x1="370" y1="240" x2="590" y2="240" class="line"/>
    <text x="370" y="258" class="fg" font-size="11">etcd</text>
    <text x="370" y="274" class="fg" font-size="11">kube-apiserver</text>
    <text x="370" y="290" class="fg" font-size="11">kube-scheduler</text>
    <text x="370" y="306" class="fg" font-size="11">kube-controller-manager</text>
    <rect class="accent-card" x="370" y="314" width="220" height="20" rx="5" stroke-width="1"/>
    <text x="480" y="328" text-anchor="middle" class="accent-text" font-size="10.5" font-weight="600">HAProxy + keepalived</text>
  </g>

  <g>
    <rect class="card" x="650" y="190" width="260" height="150" rx="10"/>
    <text x="670" y="215" class="fg" font-weight="700" font-size="13">cp-3</text>
    <text x="670" y="230" class="muted" font-size="11">192.168.56.13 · 2 vCPU / 4GB</text>
    <line x1="670" y1="240" x2="890" y2="240" class="line"/>
    <text x="670" y="258" class="fg" font-size="11">etcd</text>
    <text x="670" y="274" class="fg" font-size="11">kube-apiserver</text>
    <text x="670" y="290" class="fg" font-size="11">kube-scheduler</text>
    <text x="670" y="306" class="fg" font-size="11">kube-controller-manager</text>
    <rect class="accent-card" x="670" y="314" width="220" height="20" rx="5" stroke-width="1"/>
    <text x="780" y="328" text-anchor="middle" class="accent-text" font-size="10.5" font-weight="600">HAProxy + keepalived</text>
  </g>

  <!-- worker row -->
  <g>
    <rect class="card" x="200" y="380" width="260" height="100" rx="10"/>
    <text x="220" y="405" class="fg" font-weight="700" font-size="13">worker-1</text>
    <text x="220" y="420" class="muted" font-size="11">192.168.56.21 · 4 vCPU / 8GB</text>
    <line x1="220" y1="430" x2="440" y2="430" class="line"/>
    <text x="220" y="450" class="fg" font-size="11">kubelet · kube-proxy · containerd</text>
  </g>

  <g>
    <rect class="card" x="500" y="380" width="260" height="100" rx="10"/>
    <text x="520" y="405" class="fg" font-weight="700" font-size="13">worker-2</text>
    <text x="520" y="420" class="muted" font-size="11">192.168.56.22 · 4 vCPU / 8GB</text>
    <line x1="520" y1="430" x2="740" y2="430" class="line"/>
    <text x="520" y="450" class="fg" font-size="11">kubelet · kube-proxy · containerd</text>
  </g>
</svg>
