<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK KR', sans-serif">
  <style>
    .fg    { fill: #1A2230; }
    .muted { fill: #6B7587; }
    .head  { fill: #F1F3F7; stroke: rgba(26,34,48,0.22); }
    .panel { fill: none; stroke: rgba(26,34,48,0.18); }
    .life  { stroke: #C3C9D4; stroke-dasharray: 4 4; }
    .pkt   { stroke: #1A2230; stroke-width: 1.6; fill: none; }
    .icmp  { stroke: #0369A1; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .lost  { stroke: #DC2626; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .ok-text  { fill: #15803D; }
    .bad-text { fill: #B91C1C; }
    .accent-text { fill: #0369A1; }
    .x { stroke: #DC2626; stroke-width: 2.5; }
    text { font-size: 12.5px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A2230"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/></marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" class="fg" font-size="18" font-weight="700">내부 접속과 외부 접속의 PMTUD 비교</text>

  <!-- ===== left: internal ===== -->
  <rect class="panel" x="20" y="50" width="400" height="490" rx="12"/>
  <text x="220" y="76" text-anchor="middle" class="ok-text" font-size="14" font-weight="700">내부 서버 → 정상</text>

  <rect class="head" x="50" y="92" width="120" height="34" rx="6"/>
  <text x="110" y="114" text-anchor="middle" class="fg" font-weight="700">내부 클라이언트</text>
  <rect class="head" x="255" y="92" width="150" height="34" rx="6"/>
  <text x="330" y="114" text-anchor="middle" class="fg" font-weight="700">Control Plane (1450)</text>
  <path class="life" d="M110,126 L110,425"/>
  <path class="life" d="M330,126 L330,425"/>

  <!-- 1500 packet dropped -->
  <path class="pkt" d="M110,170 L318,170" marker-end="url(#a)"/>
  <text x="214" y="162" text-anchor="middle" class="fg">① 1500바이트 패킷</text>
  <path class="x" d="M320,162 L336,178 M336,162 L320,178"/>
  <text x="330" y="196" text-anchor="middle" class="bad-text" font-size="11.5">터널에 안 들어가 버림</text>

  <!-- ICMP back -->
  <path class="icmp" d="M330,240 L112,240" marker-end="url(#b)"/>
  <text x="220" y="232" text-anchor="middle" class="accent-text">② ICMP "1450으로 줄여라"</text>
  <text x="110" y="262" class="ok-text" font-size="11.5">받음 → 경로 MTU 1450 기록</text>

  <!-- retry smaller -->
  <path class="pkt" d="M110,320 L328,320" marker-end="url(#a)"/>
  <text x="220" y="312" text-anchor="middle" class="fg">③ 1450 이하로 나눠 재전송</text>
  <text x="330" y="342" text-anchor="middle" class="ok-text" font-size="11.5">통과 ✓</text>

  <text x="220" y="460" text-anchor="middle" class="muted">같은 서브넷이라 ICMP가 그대로 도착하고,</text>
  <text x="220" y="480" text-anchor="middle" class="muted">안에 든 원래 패킷 헤더도 클라이언트의</text>
  <text x="220" y="500" text-anchor="middle" class="muted">연결과 그대로 일치한다.</text>

  <!-- ===== right: external ===== -->
  <rect class="panel" x="440" y="50" width="500" height="490" rx="12"/>
  <text x="690" y="76" text-anchor="middle" class="bad-text" font-size="14" font-weight="700">외부 사용자 → PMTU 블랙홀</text>

  <rect class="head" x="460" y="92" width="120" height="34" rx="6"/>
  <text x="520" y="114" text-anchor="middle" class="fg" font-weight="700">외부 사용자</text>
  <rect class="head" x="630" y="92" width="120" height="34" rx="6"/>
  <text x="690" y="114" text-anchor="middle" class="fg" font-weight="700">방화벽 (NAT)</text>
  <rect class="head" x="785" y="92" width="150" height="34" rx="6"/>
  <text x="860" y="114" text-anchor="middle" class="fg" font-weight="700">Control Plane (1450)</text>
  <path class="life" d="M520,126 L520,425"/>
  <path class="life" d="M690,126 L690,425"/>
  <path class="life" d="M860,126 L860,425"/>

  <!-- 1500 packet through NAT dropped at master -->
  <path class="pkt" d="M520,170 L848,170" marker-end="url(#a)"/>
  <text x="605" y="162" text-anchor="middle" class="fg">① 1500바이트 패킷</text>
  <path class="x" d="M850,162 L866,178 M866,162 L850,178"/>
  <text x="860" y="196" text-anchor="middle" class="bad-text" font-size="11.5">버림</text>

  <!-- ICMP to firewall, then lost -->
  <path class="icmp" d="M860,240 L692,240" marker-end="url(#b)"/>
  <text x="775" y="232" text-anchor="middle" class="accent-text">② ICMP "줄여라"</text>
  <path class="lost" d="M690,262 L560,262"/>
  <path class="x" d="M548,254 L564,270 M564,254 L548,270"/>
  <text x="690" y="290" text-anchor="middle" class="bad-text" font-size="11.5">NAT 세션에 연결 안 됨</text>
  <text x="690" y="306" text-anchor="middle" class="bad-text" font-size="11.5">→ 사설 IP 그대로 나가 사라짐</text>

  <!-- retransmits -->
  <path class="pkt" d="M520,360 L848,360" marker-end="url(#a)"/>
  <text x="605" y="352" text-anchor="middle" class="fg">③ 같은 1500바이트 재전송</text>
  <path class="x" d="M850,352 L866,368 M866,352 L850,368"/>
  <path class="pkt" d="M520,400 L848,400" marker-end="url(#a)"/>
  <text x="605" y="392" text-anchor="middle" class="muted">0.2초 → 0.4초 → 0.9초 → …</text>
  <path class="x" d="M850,392 L866,408 M866,392 L850,408"/>

  <text x="690" y="460" text-anchor="middle" class="muted">ICMP를 받지 못해 같은 크기로 계속 재전송하고,</text>
  <text x="690" y="480" text-anchor="middle" class="muted">SSH는 키 교환 단계에서 멈춘 뒤</text>
  <text x="690" y="500" text-anchor="middle" class="muted">"Connection closed"로 끊긴다.</text>
</svg>
